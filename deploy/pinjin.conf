# DEPRECATED: Nginx config for ECS. Prefer GitHub Pages (see README).
# Kept only for reference / emergency rollback.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/pinjin/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
}
