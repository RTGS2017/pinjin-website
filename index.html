    <script>
      (function () {
        var path = location.pathname;
        if (path.indexOf('/pinjin-website') === 0) {
          path = path.slice('/pinjin-website'.length) || '/';
        }
        var normalized = path.replace(/\/+$/, '') || '/';
        if (normalized === '/') {
          location.replace('/en/' + location.search + location.hash);

        }
        if (path !== location.pathname) {
          location.replace(path + location.search + location.hash);
        }
      })();

        var families = 'family=Inter:wght@400;500;600;700';
        if (lang === 'zh') families += '&family=Noto+Sans+SC:wght@400;500;600';
        if (lang === 'ar') families += '&family=Noto+Sans+Arabic:wght@400;500;600;700';

        link.href = 'https://fonts.googleapis.com/css2?' + families + '&display=swap';
